<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Fichário</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap');

  :root {
    --wood: #241C15;
    --wood2: #2E241A;
    --paper: #F1EAD6;
    --paper2: #E9E0C8;
    --ink: #2A2118;
    --green: #5C7A5A;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'IBM Plex Sans', sans-serif;
    background: var(--wood);
    color: var(--paper);
    padding: 40px 24px 64px;
  }
  .display { font-family: 'Fraunces', serif; }

  /* ---------- HOME ---------- */
  .home-header { max-width: 920px; margin: 0 auto 40px; }
  .home-header h1 { font-size: clamp(2.4rem, 6vw, 3.6rem); margin: 0 0 10px; font-weight: 600; letter-spacing: -0.01em; }
  .home-header p { font-size: 1.05rem; color: #D8CDB2; max-width: 480px; line-height: 1.5; margin: 0; }

  .grid { max-width: 920px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
  @media (max-width: 760px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 480px) { .grid { grid-template-columns: 1fr; } }

  .card {
    position: relative;
    background: var(--paper);
    border-radius: 3px;
    padding: 26px 20px 22px;
    cursor: pointer;
    color: var(--ink);
    transition: transform 160ms ease;
    box-shadow: 0 10px 0 -6px rgba(0,0,0,0.25), 0 2px 6px rgba(0,0,0,0.35);
  }
  .card:hover { transform: translateY(-4px); }
  .card .tab {
    position: absolute; top: -12px; left: 18px;
    padding: 3px 12px; border-radius: 2px;
    font-family: 'Fraunces', serif; font-weight: 600; font-size: 0.72rem;
    color: #fff;
  }
  .card .icon-row { margin-top: 10px; margin-bottom: 22px; font-size: 1.6rem; }
  .card h3 { font-family: 'Fraunces', serif; font-size: 1.3rem; margin: 0 0 6px; font-weight: 600; }
  .card p { margin: 0; font-size: 0.85rem; color: #5a5142; }
  .card .status { position: absolute; bottom: 14px; right: 16px; font-size: 0.68rem; color: #8a7f68; }

  /* ---------- BIOLOGIA VIEW ---------- */
  .top-nav { max-width: 1100px; margin: 0 auto 22px; }
  .back-link { background: none; border: none; color: #D8CDB2; font-family: 'IBM Plex Sans'; font-size: 0.85rem; cursor: pointer; padding: 0; }
  .back-link:hover { color: #fff; }

  .breadcrumbs { max-width: 1100px; margin: 0 auto 20px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .crumb { background: none; border: none; color: var(--paper); font-family: 'Fraunces', serif; font-size: 1.15rem; cursor: pointer; padding: 0; }
  .crumb-sep { color: #6b5f4a; }

  .layout { max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: 340px 1fr; gap: 20px; align-items: start; }
  @media (max-width: 860px) { .layout { grid-template-columns: 1fr; } }

  .panel { background: var(--paper); color: var(--ink); border-radius: 4px; padding: 22px 22px 24px; }
  .panel h4 { font-family: 'Fraunces', serif; font-size: 1rem; margin: 0 0 4px; font-weight: 600; color: #4a4030; }

  .desc-box { margin-bottom: 18px; padding-bottom: 16px; border-bottom: 1px solid #d9cfb4; }
  .desc-box p { margin: 8px 0 0; font-size: 0.87rem; line-height: 1.55; color: #4a4030; }

  .index-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
  .index-list li button {
    width: 100%; text-align: left; background: none; border: none; cursor: pointer;
    padding: 9px 10px; border-radius: 3px; font-family: 'IBM Plex Sans'; font-size: 0.9rem; color: #3a3225;
  }
  .index-list li button:hover { background: var(--paper2); }
  .index-list li button.active { background: var(--green); color: #fff; font-weight: 600; }

  .tree-panel { background: var(--wood2); border-radius: 4px; padding: 40px 24px; display: flex; flex-direction: column; justify-content: center; min-height: 260px; }
  .tree-caption { text-align: center; font-size: 0.75rem; color: #9c8f74; margin-top: 22px; line-height: 1.5; }

  /* ---------- LINHA ÚNICA DE PROFUNDIDADE ---------- */
  .depth-line { display: flex; align-items: flex-start; justify-content: center; }
  .depth-step { display: flex; flex-direction: column; align-items: center; cursor: pointer; }
  .depth-dot {
    border-radius: 50%; background: transparent; border: 1.5px solid #6b5f47;
    transition: all 160ms ease; margin-bottom: 10px;
  }
  .depth-dot.filled { background: var(--green); border-color: var(--green); }
  .depth-dot.size-0 { width: 22px; height: 22px; }
  .depth-dot.size-1 { width: 18px; height: 18px; }
  .depth-dot.size-2 { width: 14px; height: 14px; }
  .depth-dot.size-3 { width: 11px; height: 11px; }
  .depth-step:hover .depth-dot { border-color: #C7BBA0; }
  .depth-label {
    font-family: 'Fraunces', serif; font-size: 0.8rem; color: #C7BBA0; text-align: center;
    max-width: 100px; line-height: 1.3;
  }
  .depth-step.is-active .depth-label { color: #fff; font-weight: 600; }
  .depth-connector { width: 34px; height: 1.5px; background: #55492f; margin: 10px 4px 0; }
  .depth-connector.filled { background: var(--green); }
  @media (max-width: 500px) { .depth-connector { width: 16px; } .depth-label { font-size: 0.7rem; max-width: 66px; } }

  /* ---------- PLACEHOLDER ---------- */
  .placeholder-box { max-width: 640px; margin: 60px auto; text-align: center; color: #D8CDB2; }
  .placeholder-box h2 { font-family: 'Fraunces', serif; font-size: 2rem; margin-bottom: 10px; }

</head>

/* =========================================================
   2) ESTADO (variáveis simples, sem framework nenhum)
   ========================================================= */
let view = "home";       // "home" | "biologia" | "placeholder"
let placeholderSubject = null;
let temaId = null;
let subtemaId = null;
let conceitoId = null;

const app = document.getElementById("app");

/* =========================================================
   4) FUNÇÕES DE NAVEGAÇÃO
   ========================================================= */
function abrirMateria(materia) {
  if (materia.id === "biologia") {
    view = "biologia";
  } else {
    placeholderSubject = materia;
    view = "placeholder";
  }
  render();
}
function irParaHome() {
  view = "home";
  temaId = null; subtemaId = null; conceitoId = null;
  render();
}
function escolherTema(id) {
  temaId = (temaId === id) ? null : id;
  subtemaId = null; conceitoId = null;
  render();
}
function escolherSubtema(id) {
  subtemaId = (subtemaId === id) ? null : id;
  conceitoId = null;
  render();
}
function escolherConceito(id) {
  conceitoId = (conceitoId === id) ? null : id;
  render();
}

/* =========================================================
   5) DESCOBRIR O "NÓ ATUAL" (o nível que está sendo exibido)
   ========================================================= */
function getTema() { return BIOLOGIA.find(t => t.id === temaId) || null; }
function getSubtema() { const t = getTema(); return t ? t.subtemas.find(s => s.id === subtemaId) : null; }
function getConceito() { const s = getSubtema(); return s ? s.conceitos.find(c => c.id === conceitoId) : null; }

function getNoAtual() {
  const conceito = getConceito();
  if (conceito) {
    const t = getTema(), s = getSubtema();
    return { chave: `descricao:conceito:${t.id}:${s.id}:${conceito.id}`, nome: conceito.nome, descricao: conceito.descricao, filhos: null };
  }
  const subtema = getSubtema();
  if (subtema) {
    const t = getTema();
    return { chave: `descricao:subtema:${t.id}:${subtema.id}`, nome: subtema.nome, descricao: subtema.descricao, filhos: { tipo: "conceito", lista: subtema.conceitos } };
  }
  const tema = getTema();
  if (tema) {
    return { chave: `descricao:tema:${tema.id}`, nome: tema.nome, descricao: tema.descricao, filhos: { tipo: "subtema", lista: tema.subtemas } };
  }
  return { chave: `descricao:biologia`, nome: BIOLOGIA_ROOT.nome, descricao: BIOLOGIA_ROOT.descricao, filhos: { tipo: "tema", lista: BIOLOGIA } };
}

/* =========================================================

   Não desenha os "irmãos" (isso é o que sobrecarregava a
   árvore) — só diz em texto onde ele está: nível X de 4,
   e a posição dentro da lista de irmãos.
   ========================================================= */
function getLegendaProfundidade(tema, subtema, conceito) {
  if (conceito) {
    const pos = subtema.conceitos.findIndex(c => c.id === conceito.id) + 1;
    return `Nível 4 de 4 — conceito ${pos} de ${subtema.conceitos.length} em "${subtema.nome}"`;
  }
  if (subtema) {
    const pos = tema.subtemas.findIndex(s => s.id === subtema.id) + 1;
    return `Nível 3 de 4 — subtema ${pos} de ${tema.subtemas.length} em "${tema.nome}"`;
  }
  if (tema) {
    const pos = BIOLOGIA.findIndex(t => t.id === tema.id) + 1;
    return `Nível 2 de 4 — tema ${pos} de ${BIOLOGIA.length} em Biologia`;
  }
  return `Nível 1 de 4 — o ponto de partida`;
}

/* =========================================================
   7) RENDERIZAÇÃO
   ========================================================= */
function render() {
  if (view === "home") return renderHome();
  if (view === "placeholder") return renderPlaceholder();
  if (view === "biologia") return renderBiologia();
}

function renderHome() {
  app.innerHTML = `
    <div class="home-header">
      <h1 class="display">Fichário</h1>
      <p>Um catálogo de matérias, organizado por gavetas. Abra uma e veja o quanto o assunto se ramifica, do mais geral ao mais específico.</p>
    </div>
    <div class="grid">
      ${SUBJECTS.map(s => `
        <div class="card" data-id="${s.id}">
          <span class="tab" style="background:${s.cor}">${s.nome}</span>
          <div class="icon-row">${s.emoji}</div>
          <h3>${s.nome}</h3>
          <p>${s.tagline}</p>
          ${!s.pronto ? '<span class="status">em breve</span>' : ''}
        </div>
      `).join('')}
    </div>
  `;
  app.querySelectorAll(".card").forEach(card => {
    card.addEventListener("click", () => {
      const materia = SUBJECTS.find(s => s.id === card.dataset.id);
      abrirMateria(materia);
    });
  });
}

function renderPlaceholder() {
  app.innerHTML = `
    <div class="placeholder-box">
      <button class="back-link" id="voltar">← voltar ao Fichário</button>
      <h2 class="display" style="margin-top:24px">${placeholderSubject.nome}</h2>
      <p>Essa gaveta ainda está sendo organizada. Em breve ela terá o mesmo índice ramificado da Biologia.</p>
    </div>
  `;
  document.getElementById("voltar").addEventListener("click", irParaHome);
}

function renderBiologia() {
  const tema = getTema(), subtema = getSubtema(), conceito = getConceito();
  const noAtual = getNoAtual();

  app.innerHTML = `
    <div class="top-nav"><button class="back-link" id="voltar">← voltar ao Fichário</button></div>

    <div class="breadcrumbs">
      <button class="crumb" data-nivel="biologia" style="opacity:${!tema ? 1 : 0.62}; font-weight:${!tema ? 700 : 500}">Biologia</button>
      ${tema ? `<span class="crumb-sep">/</span><button class="crumb" data-nivel="tema" style="opacity:${!subtema ? 1 : 0.62}; font-weight:${!subtema ? 700 : 500}">${tema.nome}</button>` : ''}
      ${subtema ? `<span class="crumb-sep">/</span><button class="crumb" data-nivel="subtema" style="opacity:${!conceito ? 1 : 0.62}; font-weight:${!conceito ? 700 : 500}">${subtema.nome}</button>` : ''}
      ${conceito ? `<span class="crumb-sep">/</span><button class="crumb" data-nivel="conceito" style="font-weight:700">${conceito.nome}</button>` : ''}
    </div>

    <div class="layout">
      <div class="panel">
        <div class="desc-box">
          <h4>${noAtual.nome}</h4>
          <p>${noAtual.descricao}</p>
        </div>
        ${noAtual.filhos ? `
          <h4>${noAtual.filhos.tipo === 'tema' ? 'Temas' : noAtual.filhos.tipo === 'subtema' ? 'Subtemas' : 'Conceitos'} ${noAtual.filhos.tipo !== 'tema' ? 'de ' + noAtual.nome : ''}</h4>
          <ul class="index-list">
            ${noAtual.filhos.lista.map(item => `
              <li><button data-tipo="${noAtual.filhos.tipo}" data-id="${item.id}">${item.nome}</button></li>
            `).join('')}
          </ul>
        ` : ''}
      </div>

      <div class="tree-panel">
        <div class="depth-line">
          <div class="depth-step ${!tema ? 'is-active' : ''}" data-nivel="biologia">
            <div class="depth-dot size-0 filled"></div>
            <div class="depth-label">Biologia</div>
          </div>

          <div class="depth-connector ${tema ? 'filled' : ''}"></div>
          <div class="depth-step ${tema && !subtema ? 'is-active' : ''}" data-nivel="tema">
            <div class="depth-dot size-1 ${tema ? 'filled' : ''}"></div>
            <div class="depth-label">${tema ? tema.nome : 'Tema'}</div>
          </div>

          <div class="depth-connector ${subtema ? 'filled' : ''}"></div>
          <div class="depth-step ${subtema && !conceito ? 'is-active' : ''}" data-nivel="subtema">
            <div class="depth-dot size-2 ${subtema ? 'filled' : ''}"></div>
            <div class="depth-label">${subtema ? subtema.nome : 'Subtema'}</div>
          </div>

          <div class="depth-connector ${conceito ? 'filled' : ''}"></div>
          <div class="depth-step ${conceito ? 'is-active' : ''}" data-nivel="conceito">
            <div class="depth-dot size-3 ${conceito ? 'filled' : ''}"></div>
            <div class="depth-label">${conceito ? conceito.nome : 'Conceito'}</div>
          </div>
        </div>
        <div class="tree-caption">${getLegendaProfundidade(tema, subtema, conceito)}</div>
      </div>
    </div>
  `;

  // eventos de navegação
  document.getElementById("voltar").addEventListener("click", irParaHome);
  app.querySelectorAll(".crumb").forEach(btn => {
    btn.addEventListener("click", () => {
      const nivel = btn.dataset.nivel;
      if (nivel === "biologia") { temaId = null; subtemaId = null; conceitoId = null; }
      if (nivel === "tema") { subtemaId = null; conceitoId = null; }
      if (nivel === "subtema") { conceitoId = null; }
      render();
    });
  });
  app.querySelectorAll("[data-tipo][data-id]").forEach(el => {
    el.addEventListener("click", () => {
      const { tipo, id } = el.dataset;
      if (tipo === "tema") escolherTema(id);
      if (tipo === "subtema") escolherSubtema(id);
      if (tipo === "conceito") escolherConceito(id);
    });
  });
  app.querySelectorAll(".depth-step").forEach(step => {
    step.addEventListener("click", () => {
      const nivel = step.dataset.nivel;
      if (nivel === "biologia") { temaId = null; subtemaId = null; conceitoId = null; }
      if (nivel === "tema" && tema) { subtemaId = null; conceitoId = null; }
      if (nivel === "subtema" && subtema) { conceitoId = null; }
      render();
    });
  });

}

/* =========================================================
   8) INÍCIO
   ========================================================= */
render();
</script>
</body>
</html>
